# Models evaluated in Exp 1. Every entry is pinned to a Hugging Face commit; never evaluate a floating revision.
# family: how images are sized and counted (qwen = Qwen2/2.5/3-VL and Qwen3.5 processors; gemma3 = fixed 896 px).
# vllm: keyword arguments for vllm.LLM. chat_template_kwargs: passed to the chat template (e.g. thinking on/off).
# max_tokens: generation cap; thinking runs need room for the reasoning before the answer.

qwen3-vl-8b:
  hf_id: Qwen/Qwen3-VL-8B-Instruct
  revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  family: qwen
  paper_name: QwenVL3-8B          # name used in the MI-CXR paper's Table 1
  vllm: {max_model_len: 16384, dtype: bfloat16}

